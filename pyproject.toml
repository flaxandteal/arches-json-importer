[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arches-json-importer"
version = "0.1.0"
description = "Bulk import of Arches JSON business data through the ETL loader"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
# Deliberately empty. An Arches application is only ever installed into a
# project that already pins arches itself -- coral pins arches==8.2.0a8 and
# installs it from a local checkout, not from an index -- so any specifier here
# can only conflict with that pin, never usefully constrain it. "arches>=8.2"
# did exactly that: under PEP 440 an alpha sorts below its release, so 8.2.0a8
# failed the bound and pip went looking for an arches on PyPI that does not
# exist. The real version coupling is documented in the README.
dependencies = []

[project.urls]
Repository = "https://github.com/flaxandteal/arches-json-importer"

[tool.setuptools]
packages = [
    "arches_json_importer",
    "arches_json_importer.etl_modules",
    "arches_json_importer.migrations",
]

[tool.setuptools.package-data]
arches_json_importer = [
    "templates/**/*.htm",
    "media/js/**/*.js",
    "migrations/sql/**/*.sql",
]
