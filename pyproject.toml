[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arches-json-importer"
version = "0.1.0"
description = "Bulk import of Arches JSON business data through the ETL loader"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
# The arches requirement is mandatory and its exact form matters. Arches' own
# system check (check_arches_compatibility in arches/apps.py) calls
# importlib.metadata.requires() on every arches application; with no
# dependencies it gets None and falls back to reading a pyproject.toml next to
# the installed package, which does not exist in a wheel -- a hard
# FileNotFoundError at startup.
#
# The alpha in the lower bound is equally load-bearing. Under PEP 440 an alpha
# sorts below its release, so "arches>=8.2" rejects the 8.2.0a8 that coral
# runs -- twice over: pip cannot resolve it, and SpecifierSet only considers
# prereleases at all when the specifier itself names one.
dependencies = ["arches>=8.2.0a1,<8.3"]

[project.urls]
Repository = "https://github.com/flaxandteal/arches-json-importer"

[tool.setuptools]
packages = [
    "arches_json_importer",
    "arches_json_importer.etl_modules",
    "arches_json_importer.management",
    "arches_json_importer.management.commands",
    "arches_json_importer.migrations",
]

[tool.setuptools.package-data]
arches_json_importer = [
    "templates/**/*.htm",
    "media/js/**/*.js",
    "migrations/sql/**/*.sql",
]
